name: Deploy Automatico Labs

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted # <--- Aqui está o segredo: usa a TV Box como servidor do GitHub
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Copiar arquivos para a pasta do Nginx
        run: |
          # Copia tudo da pasta do repo para o diretório web do Nginx
          sudo cp -r . /var/www/html/
          # Garante que o Nginx é o dono dos arquivos
          sudo chown -R www-data:www-data /var/www/html/
