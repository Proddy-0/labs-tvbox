name: Deploy Automatico Labs

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Puxar atualizacoes direto na TV Box
        run: |
          cd /var/www/html
          git pull origin main
          sudo chown -R www-data:www-data /var/www/html/
