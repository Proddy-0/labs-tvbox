name: Deploy Automatico Proddyt Labs

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Executar Deploy via SSH na TV Box
        uses: appleboy/ssh-action@master
        with:
          host: tvbox.proddyt.com # <--- Mudou do IP local para o domínio do Cloudflare Tunnel
          username: proddyt
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/html
            git pull origin main
