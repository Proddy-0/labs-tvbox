name: Deploy via SCP

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Enviar arquivos para a TV Box
        uses: appleboy/scp-action@master
        with:
          host: tvbox.proddyt.com
          username: proddyt
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "."
          target: "/var/www/html"
          rm: false # Deixa como false para não apagar arquivos que já estão lá por engano
