<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | LogicDeck</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <header>
        <div class="container">
            <div class="header-top">
                      <a href="index.html" class="logo">
    <img src="https://www.dropbox.com/scl/fi/shnp5xk8jj5y73xjae56d/imagem_2026-09-23_094559662.png?rlkey=5o48pzml6rfqbvz28eb4smpcr&st=fedodi1j&raw=1" alt="LogicDeck" style="height: 40px; width: auto;">
    <div>Logic<span>Deck</span></div>
</a>

                <nav class="user-nav">
                    <a href="index.html"><i class="fa-solid fa-house"></i> Voltar à Home</a>
                    <a href="carrinho.html" class="cart-btn">
                        <i class="fa-solid fa-cart-shopping"></i> Carrinho
                        <span class="cart-badge" id="cart-count">0</span>
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <main class="container auth-section">
        <div class="auth-card" id="cadastro-form-wrap">
            <div class="auth-header">
                <div class="auth-icon"><i class="fa-solid fa-user-plus"></i></div>
                <h2>Criar Conta</h2>
                <p>Cadastre-se para comprar os baralhos do seu curso.</p>
            </div>

            <form onsubmit="return handleCadastro(event)">
                <div class="form-group">
                    <label for="cad-nome">Nome completo</label>
                    <input type="text" id="cad-nome" class="form-control" placeholder="Seu nome" required>
                </div>

                <div class="form-group">
                    <label for="cad-email">E-mail</label>
                    <input type="email" id="cad-email" class="form-control" placeholder="seuemail@escola.com" required>
                </div>

                <div class="form-group">
                    <label for="cad-curso">Curso</label>
                    <select id="cad-curso" class="form-control" required>
                        <option value="">Selecione seu curso</option>
                        <option value="informatica">Informática</option>
                        <option value="mecanica">Mecânica</option>
                        <option value="eletronica">Eletrônica</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="cad-senha">Senha</label>
                    <input type="password" id="cad-senha" class="form-control" placeholder="Mínimo 6 caracteres" required>
                </div>

                <div class="form-group">
                    <label for="cad-confirmar">Confirmar senha</label>
                    <input type="password" id="cad-confirmar" class="form-control" placeholder="Repita a senha" required>
                    <span class="form-error" id="cad-erro"></span>
                </div>

                <button type="submit" class="btn-auth-submit">Criar Conta</button>
            </form>

            <div class="auth-footer-link">
                Já tem uma conta? <a href="login.html">Fazer login</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="container footer-bottom" style="border:none; text-align: center; justify-content: center;">
            <p>&copy; 2026 - LogicDeck. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
