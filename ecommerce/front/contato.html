<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | LogicDeck</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header>
        <div class="container">
            <div class="header-top">
                     <a href="index.html" class="logo">
    <img src="https://www.dropbox.com/scl/fi/shnp5xk8jj5y73xjae56d/imagem_2026-09-23_094559662.png?rlkey=5o48pzml6rfqbvz28eb4smpcr&st=fedodi1j&raw=1" alt="LogicDeck" style="height: 40px; width: auto;">
    <div>Logic<span>Deck</span></div>
</a>
                <nav class="user-nav">
                    <ul>
                        <li style="display:inline-block;">
                            <a href="index.html"><i class="fa-solid fa-house"></i> Voltar à Home</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="container" style="padding: 4rem 1.5rem; flex-grow: 1;">

        <div style="text-align: center; margin-bottom: 3rem;">
            <h1 style="font-size: 2.4rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.75rem;">Fale Conosco</h1>
            <p style="color: var(--text-muted); font-size: 1.05rem; max-width: 600px; margin: 0 auto;">
                Dúvidas, sugestões ou problemas com seu pedido? Preencha o formulário abaixo.
            </p>
        </div>

        <div style="display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 2.5rem; max-width: 1000px; margin: 0 auto; align-items: start;">

            <div style="background: var(--bg-surface); padding: 2.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-card);">
                <form action="#" method="post" id="contatoForm">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem;">
                        <div style="text-align: left;">
                            <label for="nome" style="display:block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-main); font-size: 0.9rem;">Nome</label>
                            <input type="text" id="nome" name="nome" required placeholder="Seu nome"
                                style="width: 100%; padding: 0.85rem 1rem; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: var(--radius-md, 8px); color: var(--text-main); font-size: 0.95rem; box-sizing: border-box;">
                        </div>
                        <div style="text-align: left;">
                            <label for="email" style="display:block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-main); font-size: 0.9rem;">E-mail</label>
                            <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com"
                                style="width: 100%; padding: 0.85rem 1rem; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: var(--radius-md, 8px); color: var(--text-main); font-size: 0.95rem; box-sizing: border-box;">
                        </div>
                    </div>

                    <div style="margin-bottom: 1.25rem; text-align: left;">
                        <label for="assunto" style="display:block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-main); font-size: 0.9rem;">Assunto</label>
                        <select id="assunto" name="assunto" required
                            style="width: 100%; padding: 0.85rem 1rem; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: var(--radius-md, 8px); color: var(--text-main); font-size: 0.95rem; box-sizing: border-box;">
                            <option value="">Selecione um assunto</option>
                            <option value="duvida">Dúvida sobre produto</option>
                            <option value="pedido">Problema com o pedido</option>
                            <option value="outro">Outro</option>
                        </select>
                    </div>

                    <div style="margin-bottom: 1.75rem; text-align: left;">
                        <label for="mensagem" style="display:block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-main); font-size: 0.9rem;">Mensagem</label>
                        <textarea id="mensagem" name="mensagem" rows="5" required placeholder="Escreva sua mensagem aqui..."
                            style="width: 100%; padding: 0.85rem 1rem; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: var(--radius-md, 8px); color: var(--text-main); font-size: 0.95rem; box-sizing: border-box; resize: vertical;"></textarea>
                    </div>

                    <button type="submit" class="btn-hero" style="width: 100%; justify-content: center; display: flex; align-items: center; gap: 0.6rem;">
                        <i class="fa-solid fa-paper-plane"></i> Enviar Mensagem
                    </button>
                </form>
            </div>

            <div style="display: flex; flex-direction: column; gap: 1.25rem;">

                <div style="background: var(--bg-surface); padding: 1.75rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-card); display: flex; align-items: center; gap: 1rem;">
                    <div style="width: 48px; height: 48px; flex-shrink: 0; background: rgba(139, 92, 246, 0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 1.2rem;">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <div>
                        <h4 style="color: var(--text-main); font-size: 0.95rem; margin-bottom: 0.2rem;">E-mail</h4>
                        <p style="color: var(--text-muted); font-size: 0.85rem;">dergeg@iejfiej.com</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container footer-bottom" style="border:none; text-align: center; justify-content: center;">
            <p>&copy; 2026 - LogicDeck. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
        document.getElementById('contatoForm').addEventListener('submit', function (e) {
            e.preventDefault();
            alert('Mensagem enviada! (integração com back-end ainda pendente)');
            this.reset();
        });
    </script>
</body>

</html>
